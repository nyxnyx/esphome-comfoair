esphome:
  name: test_comfoair

esp8266:
  board: esp01_1m

external_components:
  - source: 
      type: local
      path: ../../components
    components: [comfoair]

uart:
  id: uart_bus
  baud_rate: 9600
  tx_pin: TX
  rx_pin: RX

comfoair:
  name: "ComfoAir 350 Test"
  id: my_comfoair
  uart_id: uart_bus
  
  # Cover all sensor types
  fan_speed_supply:
    name: "Fan Speed"
  outside_air_temperature:
    name: "Outside Temp"
  fan_supply_percentage:
    name: "Fan Power"
  is_bypass_valve_open:
    name: "Bypass Open"
  fan_hours_supply:
    name: "Fan Hours"
  return_air_level:
    name: "Return Level"
  error_code:
    name: "Error Code"
  fan_exhaust_absent:
    name: "Exhaust Absent"
  fan_supply_high:
    name: "Supply High"
  is_supply_fan_fault:
    name: "Supply Fan Fault"
  is_t1_sensor_fault:
    name: "T1 Sensor Fault"
  is_bypass_fault:
    name: "Bypass Fault"
  delay_bathroom_switch_on:
    name: "Bathroom Switch-on Delay"
  delay_bathroom_switch_off:
    name: "Bathroom Switch-off Delay"
  analog_input_1:
    name: "Analog 1 (0-10V)"
  ewt_state:
    name: "EWT State"
  ewt_temperature_low:
    name: "EWT Temp Low"
    
  # Automation
  auto_balance:
    name: "Auto Balance"

# Template components that interact with the main component
binary_sensor:
  - platform: template
    name: "Is bypas open"
    lambda: |-
      return true;

text_sensor:
  - platform: template
    name: "Filter Status"
    lambda: |-
      return {"Ok"};

button:
  - platform: template
    name: "Reset Filter"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->reset_filter();
  - platform: template
    name: "Apply Ventilation Levels"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_ventilation_levels(15, 30, 45, 70, 15, 30, 45, 70);
  - platform: template
    name: "Configure Delays"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_delays(2, 10, 30, 16);
  - platform: template
    name: "Set PC Master Mode"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_rs232_mode(1);
  - platform: template
    name: "Force Open Bypass"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_bypass_mode(2);
  - platform: template
    name: "Configure EWT"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_ewt(7, 23, 21);
