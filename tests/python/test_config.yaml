esphome:
  name: test_comfoair

esp8266:
  board: esp01_1m

external_components:
  - source: 
      type: local
      path: ../../components
    components: [comfoair]

uart:
  id: uart_bus
  baud_rate: 9600
  tx_pin: TX
  rx_pin: RX

comfoair:
  name: "ComfoAir 350 Test"
  id: my_comfoair
  uart_id: uart_bus
  
  # Complete coverage of all sensor and binary_sensor entities
  fan_speed_supply:
    name: "Fan Speed Supply"
  fan_speed_exhaust:
    name: "Fan Speed Exhaust"
  fan_supply_percentage:
    name: "Fan Supply %"
  fan_exhaust_percentage:
    name: "Fan Exhaust %"
  is_bypass_valve_open:
    name: "Bypass Open"
  is_preheating:
    name: "Is Preheating"
  outside_air_temperature:
    name: "Outside Temp"
  supply_air_temperature:
    name: "Supply Temp"
  return_air_temperature:
    name: "Return Temp"
  exhaust_air_temperature:
    name: "Exhaust Temp"
  enthalpy_temperature:
    name: "Enthalpy Temp"
  ewt_temperature:
    name: "EWT Temp"
  reheating_temperature:
    name: "Reheating Temp"
  kitchen_hood_temperature:
    name: "Kitchen Hood Temp"
  return_air_level:
    name: "Return Level"
  supply_air_level:
    name: "Supply Level"
  is_supply_fan_active:
    name: "Supply Fan Active"
  is_filter_full:
    name: "Filter Full"
  bypass_factor:
    name: "Bypass Factor"
  bypass_step:
    name: "Bypass Step"
  bypass_correction:
    name: "Bypass Correction"
  is_summer_mode:
    name: "Summer Mode"
  fan_exhaust_absent:
    name: "Exhaust Absent"
  fan_exhaust_low:
    name: "Exhaust Low"
  fan_exhaust_medium:
    name: "Exhaust Medium"
  fan_exhaust_high:
    name: "Exhaust High"
  fan_supply_absent:
    name: "Supply Absent"
  fan_supply_low:
    name: "Supply Low"
  fan_supply_medium:
    name: "Supply Medium"
  fan_supply_high:
    name: "Supply High"
  fan_hours_supply:
    name: "Fan Hours Supply"
  fan_hours_exhaust:
    name: "Fan Hours Exhaust"
  bypass_hours:
    name: "Bypass Hours"
  preheater_hours:
    name: "Preheater Hours"
  filter_hours:
    name: "Filter Hours"
  ewt_hours:
    name: "EWT Hours"
  error_code:
    name: "Error Code"
  is_supply_fan_fault:
    name: "Supply Fan Fault"
  is_exhaust_fan_fault:
    name: "Exhaust Fan Fault"
  is_t1_sensor_fault:
    name: "T1 Sensor Fault"
  is_t2_sensor_fault:
    name: "T2 Sensor Fault"
  is_t3_sensor_fault:
    name: "T3 Sensor Fault"
  is_t4_sensor_fault:
    name: "T4 Sensor Fault"
  is_bypass_fault:
    name: "Bypass Fault"
  is_preheater_fault:
    name: "Preheater Fault"
  delay_bathroom_switch_on:
    name: "Bathroom Switch-on Delay"
  delay_bathroom_switch_off:
    name: "Bathroom Switch-off Delay"
  delay_boost:
    name: "Boost Delay"
  delay_filter_weeks:
    name: "Filter Weeks"
  analog_input_1:
    name: "Analog 1 (0-10V)"
  analog_input_2:
    name: "Analog 2 (0-10V)"
  analog_input_3:
    name: "Analog 3 (0-10V)"
  analog_input_4:
    name: "Analog 4 (0-10V)"
  ewt_state:
    name: "EWT State"
  reheater_state:
    name: "Reheater State"
  ewt_temperature_low:
    name: "EWT Temp Low"
  ewt_temperature_high:
    name: "EWT Temp High"
    
  # Automation
  auto_balance:
    name: "Auto Balance"

# Template components that interact with the main component
binary_sensor:
  - platform: template
    name: "Is bypas open"
    lambda: |-
      return true;

text_sensor:
  - platform: template
    name: "Filter Status"
    lambda: |-
      return {"Ok"};

button:
  - platform: template
    name: "Reset Filter"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->reset_filter();
  - platform: template
    name: "Apply Ventilation Levels"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_ventilation_levels(15, 30, 45, 70, 15, 30, 45, 70);
  - platform: template
    name: "Configure Delays"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_delays(2, 10, 30, 16);
  - platform: template
    name: "Set PC Master Mode"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_rs232_mode(1);
  - platform: template
    name: "Force Open Bypass"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_bypass_mode(2);
  - platform: template
    name: "Configure EWT"
    on_press:
      then:
        - lambda: |-
            id(my_comfoair)->set_ewt(7, 23, 21);
